[package]
name = "vision-core"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "OCR and image analysis library for CPC servers (Windows OCR + template matching)"
repository = "https://github.com/AIWander/vision-core"
readme = "README.md"

[lib]
name = "vision_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
screenshots = "0.8"
image = "0.24"
windows = { version = "0.58", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
] }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
chrono = "0.4"
